    </g>
    <rect x="62" y="190" width="516" height="148" rx="20" fill="#24362b" stroke="#405e4c" stroke-width="1.5"/>
    <text x="320" y="225" fill="#e8ece6" font-size="26" text-anchor="middle">Contrastive learning</text>
    <rect x="104" y="249" width="170" height="48" rx="12" fill="#18221d" stroke="#8eb7c5" stroke-width="1.5"/>
    <rect x="366" y="249" width="170" height="48" rx="12" fill="#18221d" stroke="#a4c5b2" stroke-width="1.5"/>
    <g fill="#8eb7c5">
