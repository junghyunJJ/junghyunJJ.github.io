<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="ehr-title ehr-desc">
  <title id="ehr-title">Contrastive learning for clinical foundation models</title>
  <desc id="ehr-desc">Clinical notes and structured clinical data provide complementary views of clinical information. Contrastive learning aligns representations from these two modalities to learn shared clinical representations. Blue and sage distinguish the modalities, with a two-way arrow showing cross-modal alignment. This is a conceptual overview.</desc>
  <defs>
    <marker id="ehr-arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#a4c5b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ehr-align-arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#b4a6cb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="640" height="440" rx="24" fill="#18221d"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500">
