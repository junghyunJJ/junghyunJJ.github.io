      <path d="M148 103h36m-36 9h36m-36 9h24"/>
      <path d="M128 92v46h55" fill="none" opacity=".45"/>
    </g>
    <g stroke="#a4c5b2" stroke-width="1.5">
      <rect x="424" y="83" width="96" height="48" rx="5" fill="none"/>
      <path d="M424 99h96m-96 16h96m-72-32v48m24-48v48m24-48v48" fill="none" opacity=".55"/>
    </g>
    <g fill="#a4c5b2">
      <rect x="453" y="87" width="14" height="8" rx="2" opacity=".85"/>
      <rect x="477" y="103" width="14" height="8" rx="2" opacity=".55"/>
