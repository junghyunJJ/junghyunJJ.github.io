<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="critical-wgs-title critical-wgs-desc">
  <title id="critical-wgs-title">Whole-genome study of critical COVID-19 mechanisms</title>
  <desc id="critical-wgs-desc">Conceptual schematic comparing whole genomes from critical COVID-19 cases and population controls, followed by association, transcriptome-wide association, colocalization and Mendelian-randomization analyses. Findings implicate pathways for viral control and inflammatory lung injury with coagulation. All genome, network, virus, lung and vessel glyphs are illustrative rather than measured data; individual associations do not establish clinical causality.</desc>
