<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="myositis-title myositis-desc">
  <title id="myositis-title">Polymyositis and dermatomyositis meta-analysis</title>
  <desc id="myositis-desc">Polymyositis and dermatomyositis microarray datasets are integrated through expression meta-analysis, followed by expression quantitative trait locus analysis. Findings include interferon signaling enrichment and candidate gene–variant links. Muscle fibers, skin layers, signaling steps, and expression cells are conceptual. All diagrams are conceptual illustrations, not measured values or evidence of clinical efficacy.</desc>
