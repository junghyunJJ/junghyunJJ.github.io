<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="insulin-title insulin-desc">
  <title id="insulin-title">Insulin resistance signatures in adipose tissue and cross-species models</title>
  <desc id="insulin-desc">Human white adipose tissue expression meta-analysis is compared with in vitro and in vivo insulin resistance models. Cross-species analysis identifies genes co-regulated by thiazolidinediones and metformin and prioritizes potential therapeutic targets. Adipocytes, culture dish, tissue model, matrices, and network are illustrative. All diagrams are conceptual illustrations, not measured values or evidence of clinical efficacy.</desc>
