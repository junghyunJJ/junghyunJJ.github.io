<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="spider-neurotoxins-title spider-neurotoxins-desc">
<title id="spider-neurotoxins-title">Spider neurotoxic peptides</title>
<desc id="spider-neurotoxins-desc">Conceptual discovery workflow, not measured data. Known neurotoxic peptides were augmented to train a convolutional neural network, then the model identified candidate peptides from Callobius koreanus spider RNA transcripts. Selected peptides were tested in human SH-SY5Y neuroblastoma cells and exhibited neuromodulatory effects. Sequence tracks, network layers, and peptide glyphs are illustrative.</desc>
