<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="gold-nanoparticle-toxicity-title gold-nanoparticle-toxicity-desc">
<title id="gold-nanoparticle-toxicity-title">Gold nanoparticle toxicity</title>
<desc id="gold-nanoparticle-toxicity-desc">Conceptual mechanistic summary, not measured data or an exact chemical structure. A hydrophobic moiety neighboring a positive charge was a shared structural feature of toxic modified gold nanoparticles, associated with lytic plasma-membrane interactions. Toxic nanoparticles also disrupted cytoskeletal structure, inhibited DNA replication and induced oxidative-stress-related DNA damage, and downregulated cell-cycle genes. Glyphs are schematic rather than measured results.</desc>
