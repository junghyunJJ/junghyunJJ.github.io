<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="covid-tissue-title covid-tissue-desc">
  <title id="covid-tissue-title">COVID-19 genetic signals and tissue expression regulation</title>
  <desc id="covid-tissue-desc">Conceptual schematic aligning COVID-19 GWAS signals with expression quantitative trait loci, followed by colocalization and genetic fine mapping. Associated gene-expression regulation spans lung, heart, brain and other tissue or cell types. Tracks and organs are illustrative rather than measured signals, expression levels or confirmed causal mechanisms.</desc>
