  <rect x="1" y="1" width="598" height="478" rx="20" fill="#18221d" stroke="#384e40" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <text x="28" y="49" fill="#e8ece6" font-size="32" font-weight="600">COVID-19 tissue regulation</text>
  <text x="28" y="82" fill="#a8b4ad" font-size="24">Genetic signals across tissues</text>
