<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="covid-coding-title covid-coding-desc">
  <title id="covid-coding-title">Coding variants and interpretable COVID-19 severity modelling</title>
  <desc id="covid-coding-desc">Conceptual schematic of common through ultra-rare exonic variants represented as gene-level Boolean features, selected by an ensemble of LASSO logistic regression models and combined into an Integrated PolyGenic Score. Independent-cohort testing supports an interpretable model of host-genetic contributions to severity. Feature cells and score glyphs are illustrative, not measured values or clinical performance claims.</desc>
