<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="systemic-jia-title systemic-jia-desc">
  <title id="systemic-jia-title">Systemic juvenile idiopathic arthritis expression modules and drug candidates</title>
  <desc id="systemic-jia-desc">Microarray and RNA sequencing datasets are integrated by meta-analysis and weighted gene co-expression network analysis. Up-regulated and down-regulated co-expressed gene clusters are used for in silico repositioning of potential drug candidates. All diagrams are conceptual illustrations, not measured values or evidence of clinical efficacy.</desc>
