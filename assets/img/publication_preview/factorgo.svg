<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="factorgo-title factorgo-desc">
  <title id="factorgo-title">FactorGo: latent pleiotropic factors across GWAS traits</title>
  <desc id="factorgo-desc">Conceptual schematic of FactorGo variational factor analysis applied to biobank GWAS summary statistics. Latent pleiotropic factors and phenotype loadings connect shared genetic architecture with tissue annotations, including brain enrichment for BMI, growth-related connections for height, and shared etiologies of rheumatoid arthritis and periodontal condition. Matrix colors and factor shapes are illustrative, not measured results or loadings.</desc>
