<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="colorectal-immunity-title colorectal-immunity-desc">
  <title id="colorectal-immunity-title">Immune changes along the colorectal adenoma–carcinoma sequence</title>
  <desc id="colorectal-immunity-desc">Conceptual schematic of normal colon, advanced adenoma, and colorectal carcinoma RNA sequencing. Single-cell deconvolution and immune-repertoire analysis reveal changes in innate immune composition, decreased plasma B-cells and immunoglobulin diversity, and distinctive immunoglobulin recombination. Tissue shapes, expression traces, and immune glyphs are illustrative, not measured results.</desc>
  <defs><marker id="colorectal-immunity-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a4c5b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="1" y="1" width="598" height="478" rx="20" fill="#18221d" stroke="#384e40" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="28" y="49" fill="#e8ece6" font-size="32" font-weight="650">Colorectal immunity</text>
    <text x="28" y="82" fill="#a8b4ad" font-size="24">Adenoma–carcinoma sequence</text>
    <g text-anchor="middle" fill="#e8ece6" font-size="25" font-weight="550"><text x="110" y="130">Normal</text><text x="300" y="130">Adenoma</text><text x="490" y="130">CRC</text></g>
    <path d="M37 202H563" fill="none" stroke="#53695b" stroke-width="2"/>
