    <g fill="#b4a6cb" fill-opacity=".14" stroke="#b4a6cb" stroke-width="2.5" transform="translate(0,60) scale(1,.7)"><path d="M435 196q-15-17-2-29-5-25 18-26 7-19 27-9 20-15 33 6 25-1 22 24 23 15 9 34m-87-4q-13-27 12-33 18-12 29 8 24-3 24 25"/><circle cx="470" cy="176" r="5"/><circle cx="504" cy="150" r="5"/><circle cx="529" cy="181" r="5"/></g>
