    <text x="300" y="257" text-anchor="middle" fill="#e8ece6" font-size="26" font-weight="550">RNA-seq continuum</text>
    <text x="300" y="289" text-anchor="middle" fill="#a4c5b2" font-size="24">Deconvolution + repertoire</text>
