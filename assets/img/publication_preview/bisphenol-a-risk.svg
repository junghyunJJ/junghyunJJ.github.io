<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="bpa-title bpa-desc">
  <title id="bpa-title">Bisphenol A expression meta-analysis and breast cancer overlap</title>
  <desc id="bpa-desc">BPA-associated Affymetrix microarray and Illumina RNA sequencing datasets are combined using batch-adjusted meta-analysis. Disease Ontology similarity and gene set enrichment highlight overlap with human breast cancer expression, and network analysis prioritizes candidate risk markers. The schematic does not establish that BPA causes human breast cancer. All diagrams are conceptual illustrations, not measured values or evidence of clinical efficacy.</desc>
