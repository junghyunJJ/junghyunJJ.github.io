<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="sphk2-cell-migration-title sphk2-cell-migration-desc">
<title id="sphk2-cell-migration-title">SphK2 &amp; cell migration</title>
<desc id="sphk2-cell-migration-desc">Conceptual inhibitor and cell-migration assay schematic, not measured trajectories, compound structures, or numerical results. SphK2-specific inhibitors SG12 and SG14 were assessed in HeLa cells using cumulative and individual-cell migration, actin filamentation, and motility-gene expression. They reduced overall motility with lower cytotoxicity than DMS and affected motility parameters and actin-related pathways differently. Capsule and tracking glyphs are illustrative.</desc>
