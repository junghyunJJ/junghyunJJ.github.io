    <g fill="#b4a6cb"><circle cx="439" cy="423" r="6"/><circle cx="464" cy="399" r="8"/><circle cx="504" cy="407" r="7"/><circle cx="526" cy="431" r="5"/><circle cx="476" cy="438" r="6"/></g>
