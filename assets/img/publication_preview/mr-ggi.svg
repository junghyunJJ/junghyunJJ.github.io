<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="mr-ggi-title mr-ggi-desc">
  <title id="mr-ggi-title">MR-GGI: Mendelian randomization for gene–gene interactions</title>
  <desc id="mr-ggi-desc">Conceptual schematic of MR-GGI. Causal cis-SNPs serve as instrumental variables for an exposure gene and an outcome gene in inverse-variance weighted Mendelian randomization, addressing confounding when inferring gene–gene interactions. Application to yeast data identifies gene clusters with distinct ontology-defined functions. The variant track, causal diagram, and gene clusters are illustrative, not measured results.</desc>
  <defs><marker id="mr-ggi-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a4c5b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="1" y="1" width="598" height="478" rx="20" fill="#18221d" stroke="#384e40" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="28" y="49" fill="#e8ece6" font-size="34" font-weight="650">MR-GGI</text>
    <text x="28" y="82" fill="#a8b4ad" font-size="24">Gene–gene causal inference</text>
    <rect x="24" y="107" width="552" height="76" rx="13" fill="#213028" stroke="#384e40"/>
    <text x="42" y="137" fill="#e8ece6" font-size="26" font-weight="550">cis-SNP instruments</text>
    <path d="M43 161H555" stroke="#53695b" stroke-width="3"/>
    <g fill="#d7bc87" stroke="#18221d" stroke-width="2">
      <path d="m84 153 8 8-8 8-8-8ZM124 153l8 8-8 8-8-8ZM164 153l8 8-8 8-8-8Z"/>
    </g>
    <g fill="#a4c5b2"><rect x="307" y="155" width="43" height="12" rx="3"/><rect x="378" y="155" width="66" height="12" rx="3"/><rect x="479" y="155" width="47" height="12" rx="3"/></g>
    <text x="300" y="211" text-anchor="middle" fill="#a8b4ad" font-size="23">Confounding</text>
    <g fill="none" stroke="#a8b4ad" stroke-width="2" stroke-dasharray="5 6" opacity=".65"><path d="M236 215 159 249M364 215 441 249"/></g>
    <path d="M124 183V235" fill="none" stroke="#a4c5b2" stroke-width="2.5" marker-end="url(#mr-ggi-arrow)"/>
    <g fill="#213028" stroke="#384e40" stroke-width="1.5"><rect x="35" y="242" width="181" height="83" rx="13"/><rect x="384" y="242" width="181" height="83" rx="13"/></g>
    <g text-anchor="middle" font-size="25"><text x="125" y="273" fill="#a4c5b2" font-weight="550">Exposure</text><text x="125" y="305" fill="#e8ece6">Gene A</text><text x="475" y="273" fill="#8eb7c5" font-weight="550">Outcome</text><text x="475" y="305" fill="#e8ece6">Gene B</text></g>
    <text x="300" y="267" text-anchor="middle" fill="#e8ece6" font-size="25" font-weight="600">IVW MR</text>
    <path d="M220 286H379" stroke="#a4c5b2" stroke-width="3" marker-end="url(#mr-ggi-arrow)"/>
    <path d="M300 294V339" stroke="#a4c5b2" stroke-width="2" marker-end="url(#mr-ggi-arrow)"/>
    <rect x="24" y="348" width="552" height="104" rx="13" fill="#213028" stroke="#384e40"/>
    <text x="300" y="379" text-anchor="middle" fill="#e8ece6" font-size="26" font-weight="550">Functional gene clusters</text>
    <g fill="none" stroke-width="2"><path d="m68 412 33-13 34 25-23 14-44-26 9 27 24-40" stroke="#a4c5b2"/><path d="m253 406 39 23 38-23-15 33-23-10-29 10-10-33" stroke="#8eb7c5"/><path d="m439 423 25-24 40 8 22 24-50 7-12-39 40 8-28 31" stroke="#b4a6cb"/></g>
    <g fill="#a4c5b2"><circle cx="68" cy="412" r="6"/><circle cx="101" cy="399" r="8"/><circle cx="135" cy="424" r="7"/><circle cx="112" cy="438" r="5"/><circle cx="77" cy="439" r="5"/></g>
