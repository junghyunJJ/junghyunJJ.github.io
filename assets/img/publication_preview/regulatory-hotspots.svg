<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="regulatory-hotspots-title regulatory-hotspots-desc">
  <title id="regulatory-hotspots-title">NICER: parallel eQTL mapping for regulatory hotspots</title>
  <desc id="regulatory-hotspots-desc">Conceptual schematic of NICER, or NICE Renew, an automated web workflow for regulatory hotspot analysis. Genotype and gene-expression matrices are partitioned by SNPs for independent parallel NICE processes, producing SNP–gene association p-values and an optional eQTL map. Hotspots link a variant with expression of many genes. Matrix colors, parallel lanes, and hotspot links are illustrative, not measured associations or p-values.</desc>
  <defs><marker id="regulatory-hotspots-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a4c5b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="1" y="1" width="598" height="478" rx="20" fill="#18221d" stroke="#384e40" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="28" y="49" fill="#e8ece6" font-size="32" font-weight="650">Regulatory hotspots</text>
    <text x="28" y="82" fill="#a8b4ad" font-size="24">Web-based eQTL analysis</text>
    <rect x="24" y="108" width="194" height="218" rx="13" fill="#213028" stroke="#384e40"/>
    <text x="121" y="140" text-anchor="middle" fill="#e8ece6" font-size="25" font-weight="550">Genotypes</text>
    <g stroke="#53695b" stroke-width="2"><path d="M44 165h155M44 183h155"/></g>
    <g fill="#d7bc87"><rect x="59" y="159" width="10" height="12" rx="3"/><rect x="98" y="159" width="10" height="12" rx="3"/><rect x="167" y="159" width="10" height="12" rx="3"/><rect x="59" y="177" width="10" height="12" rx="3"/><rect x="135" y="177" width="10" height="12" rx="3"/></g>
    <text x="121" y="227" text-anchor="middle" fill="#e8ece6" font-size="25" font-weight="550">Expression</text>
    <g fill="none" stroke-width="2.5"><path d="M44 253h19l7-11 11 21 9-10h23l10-11 10 11h65M44 277h28l10-13 11 25 10-12h20l10-8 9 8h56" stroke="#a4c5b2"/><path d="M44 301h14l10-9 10 16 12-7h22l8-11 10 11h68" stroke="#8eb7c5"/></g>
    <path d="M220 215H250" stroke="#a4c5b2" stroke-width="2.5" marker-end="url(#regulatory-hotspots-arrow)"/>
    <rect x="258" y="108" width="318" height="218" rx="13" fill="#213028" stroke="#384e40" stroke-width="1.5"/>
    <path d="M258 139h318" stroke="#384e40"/><g fill="#a8b4ad"><circle cx="277" cy="123" r="4"/><circle cx="292" cy="123" r="4"/><circle cx="307" cy="123" r="4"/></g>
    <text x="417" y="174" text-anchor="middle" fill="#e8ece6" font-size="28" font-weight="650">NICER</text>
    <!-- SNP partitions enter independent NICE processes; the map is schematic. -->
    <g fill="#8eb7c5" fill-opacity=".25" stroke="#8eb7c5" stroke-width="1.2"><rect x="281" y="194" width="14" height="73" rx="3"/><rect x="301" y="194" width="14" height="73" rx="3"/><rect x="321" y="194" width="14" height="73" rx="3"/></g>
    <g stroke="#a4c5b2" stroke-width="2" fill="none"><path d="M347 205h70M347 230h70M347 255h70"/></g>
    <g fill="#a4c5b2" stroke="#18221d" stroke-width="1.5"><rect x="355" y="199" width="25" height="12" rx="3"/><rect x="386" y="199" width="25" height="12" rx="3"/><rect x="355" y="224" width="25" height="12" rx="3"/><rect x="386" y="224" width="25" height="12" rx="3"/><rect x="355" y="249" width="25" height="12" rx="3"/><rect x="386" y="249" width="25" height="12" rx="3"/></g>
    <rect x="436" y="193" width="116" height="76" rx="5" fill="#18221d" stroke="#384e40"/>
    <g fill="#8eb7c5" fill-opacity=".22"><path d="M441 198h21v18h-21zm29 0h21v18h-21zm29 0h21v18h-21zm29 0h19v18h-19zM441 222h21v18h-21zm29 0h21v18h-21zm29 0h21v18h-21zm29 0h19v18h-19zM441 246h21v18h-21zm29 0h21v18h-21zm29 0h21v18h-21zm29 0h19v18h-19z"/></g>
    <g fill="#d7bc87" fill-opacity=".8"><rect x="470" y="198" width="21" height="18" rx="2"/><rect x="470" y="222" width="21" height="18" rx="2"/><rect x="470" y="246" width="21" height="18" rx="2"/></g>
