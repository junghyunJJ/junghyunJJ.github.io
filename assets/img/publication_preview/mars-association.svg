    </g>
    <path d="M335 369H360" fill="none" stroke="#a4c5b2" stroke-width="2.5" marker-end="url(#association-arrow)"/>
    <rect x="366" y="286" width="210" height="166" rx="14" fill="#23342a" stroke="#a4c5b2" stroke-width="1.8"/>
    <text x="471" y="322" text-anchor="middle" fill="#e8ece6" font-size="28" font-weight="700">MARS test</text>
    <g fill="none" stroke-width="2.5" stroke-linecap="round">
      <path d="M407 341 442 357H468" stroke="#a4c5b2"/>
      <path d="M407 357H468" stroke="#8eb7c5"/>
