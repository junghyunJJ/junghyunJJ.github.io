      <rect x="477" y="341" width="49" height="32" rx="8" fill="#a4c5b2" fill-opacity=".12" stroke="#a4c5b2"/>
      <path d="m489 356 8 7 17-15" stroke="#a4c5b2"/>
    </g>
    <text x="471" y="405" text-anchor="middle" fill="#e8ece6" font-size="26" font-weight="600">Locus</text>
    <text x="471" y="435" text-anchor="middle" fill="#e8ece6" font-size="26" font-weight="600">association</text>
  </g>
</svg>
