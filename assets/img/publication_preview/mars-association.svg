    <g fill="#18221d" stroke="#617369" stroke-width="1.5">
      <circle cx="63" cy="352" r="7"/><circle cx="108" cy="352" r="7"/><circle cx="153" cy="352" r="7"/><circle cx="198" cy="352" r="7"/><circle cx="243" cy="352" r="7"/><circle cx="288" cy="352" r="7"/>
      <circle cx="63" cy="390" r="7"/><circle cx="108" cy="390" r="7"/><circle cx="153" cy="390" r="7"/><circle cx="198" cy="390" r="7"/><circle cx="243" cy="390" r="7"/><circle cx="288" cy="390" r="7"/>
      <circle cx="63" cy="426" r="7"/><circle cx="108" cy="426" r="7"/><circle cx="153" cy="426" r="7"/><circle cx="198" cy="426" r="7"/><circle cx="243" cy="426" r="7"/><circle cx="288" cy="426" r="7"/>
