<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="immunogenomics-title immunogenomics-desc">
  <title id="immunogenomics-title">JIA immunogenomics: connecting risk evidence to T-cell populations</title>
  <desc id="immunogenomics-desc">Conceptual schematic of juvenile idiopathic arthritis immunogenomics. Risk-gene expression, protein evidence, and HLA alleles converge in an integrated evidence network that informs the study of distinct T-cell populations and expanded clones. Glyphs are illustrative, not measured results or confirmed causal relationships.</desc>
  <defs>
    <marker id="immune-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#a8b4ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="immune-cell">
      <circle r="15" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="2"/>
      <circle r="5" fill="currentColor" fill-opacity="0.65"/>
      <path d="M0-15v-8m0 2-5-5m5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>
  <rect x="1" y="1" width="598" height="478" rx="20" fill="#18221d" stroke="#384e40" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="28" y="49" fill="#e8ece6" font-size="32" font-weight="650">JIA immunogenomics</text>
    <text x="28" y="83" fill="#a8b4ad" font-size="24">From risk to immune biology</text>
    <g fill="#203028" stroke="#384e40" stroke-width="1.5">
      <rect x="24" y="108" width="170" height="124" rx="13"/>
      <rect x="215" y="108" width="170" height="124" rx="13"/>
      <rect x="406" y="108" width="170" height="124" rx="13"/>
    </g>
    <g text-anchor="middle" fill="#e8ece6" font-size="26" font-weight="550">
      <text x="109" y="142">Genes</text>
      <text x="300" y="142">Proteins</text>
      <text x="491" y="142">HLA</text>
    </g>
    <!-- Gene-expression evidence: a sequence helix beside expression traces. -->
    <g fill="none" stroke="#a4c5b2" stroke-width="2.6" stroke-linecap="round">
      <path d="M47 160c32 14 0 38 32 53M79 160c-32 14 0 38-32 53"/>
      <path d="M50 164h26m-19 11h12m-12 12h12m-19 13h26m-24 10h22" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M98 176h15l8-13 9 24 10-11h33M98 204h14l10-7 9 12 11-19 9 14h22"/>
    </g>
    <!-- Protein associations, drawn without assigning quantitative weights. -->
    <g stroke="#8eb7c5" stroke-width="2" stroke-opacity="0.7">
      <path d="m246 187 28-22 28 24 27-24 27 31-33 15-21-22-28 21-28-23m28-22v45m55-45-6 46" fill="none"/>
      <g fill="#8eb7c5" stroke="#18221d" stroke-width="3">
        <circle cx="246" cy="187" r="7"/><circle cx="274" cy="165" r="8"/>
        <circle cx="274" cy="210" r="7"/><circle cx="302" cy="189" r="10"/>
        <circle cx="329" cy="165" r="7"/><circle cx="323" cy="211" r="7"/>
        <circle cx="356" cy="196" r="8"/>
      </g>
    </g>
    <!-- Parallel allele bands represent complementary HLA evidence. -->
    <g fill="#b4a6cb" fill-opacity="0.17" stroke="#b4a6cb" stroke-width="1.7">
      <rect x="430" y="160" width="122" height="12" rx="5"/>
      <rect x="430" y="181" width="122" height="12" rx="5"/>
      <rect x="430" y="202" width="122" height="12" rx="5"/>
    </g>
    <g fill="#b4a6cb">
      <rect x="444" y="160" width="22" height="12" rx="3"/>
      <rect x="493" y="160" width="15" height="12" rx="3"/>
      <rect x="455" y="181" width="16" height="12" rx="3"/>
      <rect x="515" y="202" width="24" height="12" rx="3"/>
    </g>
    <g fill="#d7bc87">
      <rect x="491" y="181" width="29" height="12" rx="3"/>
      <rect x="450" y="202" width="26" height="12" rx="3"/>
    </g>
    <g fill="none" stroke="#a8b4ad" stroke-width="2" stroke-opacity="0.75" marker-end="url(#immune-arrow)">
      <path d="M109 234v17q0 44 138 44"/>
      <path d="M300 234v40"/>
      <path d="M491 234v17q0 44-138 44"/>
    </g>
    <rect x="230" y="243" width="140" height="25" rx="5" fill="#18221d"/>
    <text x="300" y="264" text-anchor="middle" fill="#e8ece6" font-size="23">Integration</text>
    <g fill="none" stroke="#a8b4ad" stroke-width="2" stroke-opacity="0.7">
      <path d="m260 296 25-13 17 17 27-17 12 21-36 15-20-36 20 36-45-23 69-13"/>
    </g>
    <g stroke="#18221d" stroke-width="2.5">
      <circle cx="260" cy="296" r="7" fill="#a4c5b2"/>
      <circle cx="285" cy="283" r="7" fill="#a4c5b2"/>
      <circle cx="302" cy="300" r="10" fill="#e8ece6"/>
      <circle cx="329" cy="283" r="7" fill="#8eb7c5"/>
      <circle cx="341" cy="304" r="7" fill="#b4a6cb"/>
      <circle cx="305" cy="319" r="7" fill="#d7bc87"/>
    </g>
    <g fill="none" stroke="#a8b4ad" stroke-width="2" stroke-opacity="0.7" marker-end="url(#immune-arrow)">
      <path d="M279 320q-30 14-149 24"/>
      <path d="M302 329v17"/>
      <path d="M327 320q30 14 143 24"/>
    </g>
    <!-- Distinct receptor-bearing populations; repeated glyphs suggest clones. -->
    <g stroke-width="1.5" stroke-dasharray="4 6" fill-opacity="0.05">
      <ellipse cx="130" cy="386" rx="71" ry="40" fill="#a4c5b2" stroke="#a4c5b2"/>
      <ellipse cx="300" cy="386" rx="71" ry="40" fill="#8eb7c5" stroke="#8eb7c5"/>
      <ellipse cx="470" cy="386" rx="71" ry="40" fill="#b4a6cb" stroke="#b4a6cb"/>
    </g>
    <g color="#a4c5b2">
      <use href="#immune-cell" x="99" y="391"/>
      <use href="#immune-cell" x="132" y="372"/>
      <use href="#immune-cell" x="163" y="394"/>
    </g>
    <g color="#8eb7c5">
      <use href="#immune-cell" x="269" y="393"/>
      <use href="#immune-cell" x="301" y="372"/>
      <use href="#immune-cell" x="333" y="394"/>
    </g>
    <g color="#b4a6cb">
      <use href="#immune-cell" x="438" y="392"/>
      <use href="#immune-cell" x="471" y="372"/>
      <use href="#immune-cell" x="503" y="394"/>
    </g>
    <text x="300" y="456" text-anchor="middle" fill="#e8ece6" font-size="26" font-weight="550">T-cell populations</text>
  </g>
</svg>
