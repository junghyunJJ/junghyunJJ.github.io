<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="galectin3-stemness-title galectin3-stemness-desc">
<title id="galectin3-stemness-title">Galectin-3 &amp; stemness</title>
<desc id="galectin3-stemness-desc">Conceptual mechanism schematic, not measured data. In ovarian cancer models galectin-3 interacted with the Notch1 intracellular domain, supported its cleavage and nuclear translocation, and increased Notch target-gene expression, including Hes1 and Hey1. Galectin-3 supported ovarian cancer stem-cell maintenance. Protein folds, nuclear gene tracks, and the stem-cell cluster are illustrative and do not represent exact structures or measured cell numbers.</desc>
