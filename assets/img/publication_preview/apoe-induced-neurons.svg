<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="apoe-induced-neurons-title apoe-induced-neurons-desc">
<title id="apoe-induced-neurons-title">APOE ε3/4 induced neurons</title>
<desc id="apoe-induced-neurons-desc">Conceptual induced-neuron disease-model schematic, not measured data. Direct lineage conversion produced mouse and human induced neurons; with mutant APP overexpression in the APOE ε3/4 background they showed altered APP processing, increased amyloid-beta42, and tau hyperphosphorylation. Patient-neuron gene-network analysis implicated DSG2, and DSG2 knockdown rescued defective APP processing in this cell model. This is not a clinical-treatment efficacy diagram.</desc>
