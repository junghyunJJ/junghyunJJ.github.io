<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="maternal-neonatal-immunity-title maternal-neonatal-immunity-desc">
<title id="maternal-neonatal-immunity-title">CMV &amp; neonatal immunity</title>
<desc id="maternal-neonatal-immunity-desc">Conceptual observational study schematic, not measured data. Maternal mid-pregnancy cytokines were weakly correlated with cytokines at birth. Neonatal CMV proteins were assessed alongside neonatal cytokines and childhood acute lymphoblastic leukemia case-control status; CMV-IL-10 was positively associated with ALL risk. The dashed connector indicates the weak maternal-neonatal correlation, not a demonstrated causal pathway.</desc>
