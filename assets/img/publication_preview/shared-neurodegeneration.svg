<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="shared-neuro-title shared-neuro-desc">
  <title id="shared-neuro-title">Shared pathways in cerebral adrenoleukodystrophy and Alzheimer’s disease</title>
  <desc id="shared-neuro-desc">Expression data from cALD and Alzheimer’s disease are compared through gene set enrichment, weighted gene correlation networks, and protein interaction analysis. ANXA5, B2M, CD44, and FGF2 are shared candidate genes associated with inflammation, apoptosis, and MAPK signaling. All diagrams are conceptual illustrations, not measured values or evidence of clinical efficacy.</desc>
