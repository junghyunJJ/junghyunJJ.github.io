<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="deepmast-title deepmast-desc">
  <title id="deepmast-title">DeepMAST: an evidence-governed agent harness</title>
  <desc id="deepmast-desc">Conceptual overview of DeepMAST. Spatial transcriptomics data and evidence resources, including literature and biological databases, feed agents built from task-specific skills and MCP-connected tools, which work within custom guardrails and a validation-driven repair loop. The harness returns biological interpretation, follow-up recommendations, and drug target prioritization. Spots and icons are illustrative rather than measured results.</desc>
