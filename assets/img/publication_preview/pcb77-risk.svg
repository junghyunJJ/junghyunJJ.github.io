  <title id="pcb77-title">PCB77 toxicogenomic risk assessment</title>
  <desc id="pcb77-desc">PCB77 microarray expression datasets are combined with the Rank Product method. Enrichment analysis highlights apoptotic processes and unfolded-protein responses, while protein interaction networks identify HSP90AB1 and HSPA5 as hubs. Molecular and cellular diagrams are schematic. All diagrams are conceptual illustrations, not measured values or evidence of clinical efficacy.</desc>
