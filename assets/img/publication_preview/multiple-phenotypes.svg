<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="multiple-phenotypes-title multiple-phenotypes-desc">
  <title id="multiple-phenotypes-title">GAMMAR: population-aware parallel multiple-phenotype association</title>
  <desc id="multiple-phenotypes-desc">Conceptual schematic of GAMMA Renew, or GAMMAR. Genotypes and multiple phenotypes enter generalized analysis of molecular variance for mixed-model analysis, accounting for population structure. The R package parallelizes multiple-phenotype association and was evaluated on yeast data to locate trans-regulatory hotspots. Matrices, population clusters, computation lanes, and hotspot links are illustrative, not measured results.</desc>
