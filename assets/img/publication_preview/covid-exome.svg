<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="covid-exome-title covid-exome-desc">
  <title id="covid-exome-title">COVID-19 exome-wide rare-variant burden analysis</title>
  <desc id="covid-exome-desc">Conceptual schematic of whole-exome and whole-genome cohorts, rare-variant gene burden analysis, and the observed association of rare deleterious TLR7 variants with severe COVID-19. The receptor and RNA glyphs illustrate TLR7 biology; variant marks and people are schematic, not measurements or causal proof.</desc>
