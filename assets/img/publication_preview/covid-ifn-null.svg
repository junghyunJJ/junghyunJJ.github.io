<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="covid-ifn-null-title covid-ifn-null-desc">
  <title id="covid-ifn-null-title">Rare type I interferon loss-of-function variants: no association observed</title>
  <desc id="covid-ifn-null-desc">Conceptual schematic of severe and mild COVID-19 cases and ancestry-matched population controls sequenced to test rare predicted loss-of-function variants in 13 candidate TLR3- and IRF7-dependent type I interferon immunity genes. In these cohorts the study observed no enrichment in severe cases and no evidence of association. This cohort-specific null result is not proof that the pathway has no biological role. People and network nodes are illustrative rather than measured counts or frequencies.</desc>
  <defs><marker id="covid-ifn-null-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4c5b2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="1" y="1" width="598" height="478" rx="20" fill="#18221d" stroke="#384e40" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <text x="28" y="49" fill="#e8ece6" font-size="32" font-weight="600">COVID-19 IFN gene test</text>
  <text x="28" y="82" fill="#a8b4ad" font-size="24">Rare loss-of-function variants</text>
