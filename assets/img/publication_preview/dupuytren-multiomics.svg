<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="dupuytren-multiomics-title dupuytren-multiomics-desc">
  <title id="dupuytren-multiomics-title">Dupuytren’s disease: co-expression signatures and genetic regulation</title>
  <desc id="dupuytren-multiomics-desc">Conceptual schematic of Dupuytren’s disease expression data analyzed with WGCNA to define a co-expressed disease signature, assessed by enrichment and meta-analysis. The signature is enriched for unfolded protein response related to endoplasmic reticulum stress. Multiple-phenotype regression using GTEx data identifies trans-regulatory hotspots and cis-eQTL-associated eGenes. Heatmaps, gene modules, ER folds, and genomic links are illustrative, not measured results.</desc>
