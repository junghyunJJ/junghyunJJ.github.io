<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="covid-architecture-title covid-architecture-desc">
  <title id="covid-architecture-title">Updated genetic architecture of COVID-19</title>
  <desc id="covid-architecture-desc">Conceptual overview of the COVID-19 Host Genetics Initiative GWAS meta-analysis: studies across populations are combined to map additional loci associated with infection susceptibility and disease severity, with SFTPD, MUC5B and ACE2 as examples from new loci. Association points and connecting lines are illustrative, not observed GWAS data or confirmed causal links.</desc>
