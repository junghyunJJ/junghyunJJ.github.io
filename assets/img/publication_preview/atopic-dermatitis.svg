<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="atopic-title atopic-desc">
  <title id="atopic-title">Atopic dermatitis: integrated transcriptomic drug repositioning</title>
  <desc id="atopic-desc">A transcriptome-wide association study and meta-analysis of public expression studies converge on an atopic dermatitis signature. Connectivity Map perturbation analysis prioritizes potential drug candidates. The skin layers and expression patterns are illustrative. All diagrams are conceptual illustrations, not measured values or evidence of clinical efficacy.</desc>
